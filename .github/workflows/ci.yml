name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow"). This gate builds against
  # a submodule pin, so the useful manual case is not "run it again" but "run it
  # unchanged after Hermod moved" — checking out a pin that has not been bumped
  # yet is exactly what the button is for.
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head
  # that has been superseded is answering a question nobody is asking any
  # more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with
  # no verdict is a hole nobody comes back to fill: the next commit contains
  # it, so the code does get tested eventually, but once that run is red
  # there is no longer any way to say which of the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress
  # off, is what makes that hold for more than two pushes: a group keeps at
  # most one run *pending*, so a third push discards the second before it
  # ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # One leg per platform this repository is expected to work on:
    #
    #  * Windows, because it is where the stack has been verified longest and
    #    where the harness suite is known to be 48/48.
    #  * Debian 13, matching the sibling repositories. GitHub offers no Debian
    #    runner image, so this runs on an Ubuntu runner inside a debian:13
    #    container — deliberately not the official .NET SDK image, which is
    #    still Debian-12-based.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most
    # valuable signal this matrix produces, and for this repository it is not
    # hypothetical — see the harness step below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # BEFORE the checkout, not after: a bare debian:13 image has no git, and
      # `submodules: recursive` needs it — without git, actions/checkout falls
      # back to a tarball download that cannot fetch submodules at all, and the
      # whole build then fails on an empty libs/. The rest are the .NET runtime
      # prerequisites: curl for the install script, ICU and tzdata for
      # globalization, OpenSSL for crypto, ca-certificates for NuGet over HTTPS.
      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # The HTTP/2 stack lives in the Hermod submodule, Styx below that —
      # without a recursive checkout nothing here compiles at all.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Debug, not Release, which is where this gate diverges from the sibling
      # repositories — and it is the harness runner that forces it.
      # run-tests.sh looks for a built assembly under bin/Debug first and
      # bin/Release second; against a Release-only build it does find one, but
      # the demo host it starts is located the same way, so the two would have
      # to agree. Adding a configuration flag is what this needs before it can
      # match Hermod's `--configuration Release`. The tests below are
      # correctness checks, not benchmarks, so Debug costs nothing but
      # wall-clock here.
      - name: Build
        run: dotnet build HTTP2.slnx

      # The stack itself lives in the submodule and Hermod's own CI runs its full
      # suite. What this gate adds is the pinned commit: the demo host and the
      # harnesses here must still compile against it, and its 213 HTTP/2 tests
      # must still pass. None of them touch the network — everything runs
      # in-process against our own server — so this is a real gate.
      #
      # The filter is the fully-qualified namespace on purpose. The obvious
      # shorthand "FullyQualifiedName~HTTP2" is far too loose: it matches every
      # test in the assembly (2085 of them, the whole of Hermod), which passes
      # but gates something else entirely than it claims to.
      - name: Test (213 HTTP/2 tests, from the pinned Hermod)
        timeout-minutes: 30
        run: dotnet test libs/Hermod/HermodTests/HermodTests.csproj --no-build --filter "FullyQualifiedName~Hermod.Tests.HTTP2" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # This is what this repository has that Hermod's own CI cannot run: 48
      # raw-frame scenarios driven against a live demo host over a real socket —
      # abuse/hardening, CONNECT/WebSocket, RFC 9218 priority, RFC 9110
      # semantics. The runner starts the demo on :8443/:8080, drives one process
      # per scenario, and stops it again.
      #
      # ONE step for both legs, and one runner behind it. There used to be two,
      # a PowerShell one for Windows and a bash one for Linux, and the pair is
      # worth a paragraph because of how it failed.
      #
      # Both things this matrix found, it found by the legs DISAGREEING. The
      # Linux leg was added to answer a question WSL could not — whether /mnt/d
      # and Windows-hosted networking explained the 46/48 the bash runner first
      # reported — and the first run said no: 45/48 here, sharing no kernel,
      # filesystem or hardware with that box, and `h2attack trailers
      # no-endstream` failing with a byte-identical stack trace. That was a real
      # server bug (a rejected trailer block was not HPACK-decoded, desyncing
      # the connection's dynamic table so the NEXT request died with a
      # COMPRESSION_ERROR), fixed in Hermod and pinned by
      # RejectedTrailers_DoNotDesyncHPACK. The two `h2priority` scenarios were
      # harness defects: they asserted which stream the writer prefers without
      # ever establishing that both streams were candidates.
      #
      # And the third finding was the runner itself. run-tests.ps1 declared its
      # harness-argument parameter as $Args — an automatic PowerShell variable,
      # so it was never bound — and every demo-driven harness therefore ran with
      # no arguments, i.e. its default mode. Twelve h2attack labels, one
      # scenario executed twelve times, 48/48 reported. That is why Windows
      # "passed" the trailers scenario the server bug was hiding behind: it
      # never ran it. Two runners produced two numbers that read as agreement.
      #
      # So the PowerShell runner is gone rather than fixed. The bash one works
      # under the Git Bash that ships on GitHub's Windows images (verified
      # locally too, including the stale-listener path that needs a Windows
      # branch — see tests/lib.sh). One implementation, one scenario list, and
      # a disagreement between the legs now means a real platform difference.
      - name: Harness suite (48 runs)
        timeout-minutes: 30
        shell: bash
        run: tests/run-tests.sh --no-build

      # The console log answers "did it pass" and almost nothing else: which test
      # failed takes grepping the step log, and a skip reason never reaches the
      # console at normal verbosity at all. TRX keeps outcome, duration, error
      # message, stack trace and the Assert.Ignore text per test, and
      # `gh run download` fetches it without a signed-in browser session.
      #
      # !cancelled() rather than success(): a red run is when these files matter
      # most, and a build that fails before the test step leaves no .trx, which
      # upload-artifact reports as a warning rather than a second failure — the
      # compile error is the finding there.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.trx
