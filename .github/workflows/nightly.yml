name: Nightly

# ci.yml gates every push with everything this repository carries itself: the 212
# in-process HTTP/2 tests and the 48 raw-frame harness scenarios. This workflow
# adds the two external conformance suites it does not carry — h2spec (RFC 9113 +
# RFC 7541, 146 cases over both transports) and the Autobahn TestSuite (RFC 6455 +
# permessage-deflate, 517 cases).
#
# They are here rather than in the gate because of how they are ACQUIRED, not how
# they behave: h2spec is a release binary from another repository and Autobahn is
# a Docker Hub image. A moved release asset or a registry rate limit would turn a
# push red for a reason that has nothing to do with this code, and a gate that
# fails for reasons outside the change is a gate people learn to ignore.
#
# What they are NOT is flaky, and this is where this workflow differs from the
# sibling repository's nightly: that one reaches eight foreign servers over the
# public internet and is deliberately informational. These two drive OUR server
# over loopback, with the suite the only foreign part. 146/146 and 517/517 are
# exact numbers, so both jobs gate on their result — a nightly that reports a
# number without failing on it is a report nobody reads.
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without any repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:11 UTC — after Hermod (02:17) and HTTP/3 (02:43) so the three do not
    # contend, and off the hour, where GitHub's scheduler is busiest and delays
    # runs by tens of minutes.
    - cron: '11 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned rather than "latest": a conformance number is only comparable between
  # nights if the suite producing it does not move underneath them. v2.6.0 is
  # what tests/TestingAgainst_h2spec.md documents and what 146/146 was measured
  # against.
  H2SPEC_VERSION: '2.6.0'

jobs:

  h2spec:
    # The same two legs as ci.yml. h2spec is a self-contained Go binary with a
    # per-platform asset, so both are cheap to cover — and worth covering: the
    # harness suite already differs between Windows and Linux (see "Two harnesses
    # that differ on Linux" in CLAUDE.md), which is exactly the kind of thing a
    # single-platform conformance run would have hidden.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Before the checkout: a bare debian:13 has no git, and submodules:
      # recursive needs it. Same ordering and reasoning as ci.yml — tar is needed
      # here too, for the h2spec tarball.
      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tar tzdata

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install h2spec (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL "https://github.com/summerwind/h2spec/releases/download/v${H2SPEC_VERSION}/h2spec_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin
          h2spec --version

      # The install stays pwsh — Expand-Archive is the least fuss for a .zip —
      # but it ends by putting the directory on GITHUB_PATH rather than handing
      # the binary's location to the next step. That is what lets the run step
      # below be one step instead of two: tests/h2spec.sh finds h2spec.exe via
      # `command -v` like any other tool, and no backslash path has to survive
      # a trip through bash.
      - name: Install h2spec (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'h2spec'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'h2spec.zip'
          Invoke-WebRequest -Uri "https://github.com/summerwind/h2spec/releases/download/v$env:H2SPEC_VERSION/h2spec_windows_amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          & (Join-Path $dir 'h2spec.exe') --version
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # Debug, for the same reason as ci.yml: the runner scripts resolve the
      # default configuration.
      - name: Build
        run: dotnet build HTTP2.slnx

      # Both transports in one invocation — the TLS listener on :8443 and the
      # cleartext h2c listener on :8080. 146/146 was measured over both, and h2c
      # is where a framing assumption that TLS happens to mask would show up.
      #
      # The runner starts and stops the demo host itself, redirecting its output
      # to a file: under h2spec's flood of malformed cases the demo logs heavily,
      # and an undrained console pipe can block it mid-run.
      # The exit code is captured BEFORE the summary is written, and the step ends
      # on it. Both halves of that matter: the summary commands would otherwise
      # overwrite $? / $LASTEXITCODE and the step could never fail, and running
      # the pipeline under `set -e` would abort before the summary on exactly the
      # night the summary is worth having.
      # One step for both legs: tests/h2spec.ps1 was removed along with the
      # other two PowerShell runners (see ci.yml's harness step for why), and
      # the bash one runs under the Git Bash on GitHub's Windows images.
      - name: h2spec over h2 and h2c
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p artifacts
          log="artifacts/h2spec-${{ matrix.leg }}.txt"
          set +e
          tests/h2spec.sh --no-build 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '## h2spec — ${{ matrix.leg }}'
            echo
            echo '```'
            tail -40 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # !cancelled() rather than success(): the night h2spec reports a failure is
      # precisely the night whose output is worth keeping, and the step summary
      # above is only comfortable to read while the run is the newest one.
      - name: Upload h2spec output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: h2spec-${{ matrix.leg }}
          path: artifacts/*.txt

  autobahn:
    # Plain ubuntu-latest, deliberately NOT the debian:13 container the other
    # jobs run in. The Autobahn suite only ships usably as a Docker image (the
    # native wstest is legacy Python 2), and there is no Docker daemon inside
    # that container — docker-in-docker is not set up and does not need to be,
    # because GitHub's Ubuntu runner has a daemon already. That is the whole
    # reason this is a separate job rather than a third matrix leg.
    #
    # Windows is absent for the same class of reason: the runner's Docker is in
    # Windows-container mode, and `--network host` (which is how the suite
    # reaches our echo server on loopback) is a Linux-container feature. The
    # framing under test is transport-agnostic, so one platform answers it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HTTP2.slnx

      # The suite drives ~500 cases against tests/autobahn-server, which exposes
      # the same WebSocketConnection framing production uses, over a plain-TCP
      # tunnel behind a minimal HTTP/1.1 Upgrade. Autobahn speaks WebSocket over
      # HTTP/1.1 rather than RFC 8441 over HTTP/2, but the framing under test is
      # the same code either way — see tests/TestingAgainst_Autobahn.md.
      #
      # The script parses index.json itself and exits non-zero unless every case
      # is OK, NON-STRICT or INFORMATIONAL. jq is preinstalled on this runner, so
      # it takes that path rather than the python3 fallback.
      - name: Autobahn fuzzingclient (517 cases)
        timeout-minutes: 45
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          tests/autobahn.sh --no-build 2>&1 | tee artifacts/autobahn.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '## Autobahn TestSuite'
            echo
            echo '```'
            tail -30 artifacts/autobahn.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # The HTML report is the part worth keeping: it names the failing case and
      # shows the frames exchanged, which the console summary does not. Both it
      # and the raw JSON land in tests/autobahn/reports.
      - name: Upload Autobahn report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: autobahn-report
          path: |
            tests/autobahn/reports/
            artifacts/autobahn.txt

  # Named to match the sibling conformance repositories, which grew the same job
  # independently: DNSConformanceTests and NTSConformanceTests both carry an
  # `against-<library>-master`. Same concept, same place in the workflow, so it
  # should read the same across the three. Styx is advanced along with Hermod.
  against-hermod-master:
    # "Is the pin still safe to advance?" — the one question ci.yml structurally
    # cannot answer, because it tests the pinned submodule commit by design.
    #
    # That design is right for a gate: a push gate exists to answer "did MY
    # change break something", and a gate floating on someone else's master is
    # green today and red tomorrow for the same commit, which stops identifying
    # the culprit and starts training people to click past a red badge.
    #
    # But the blind spot is real and has already cost us. Hermod's
    # URL/URIScheme/HTTPMethod refactoring broke tests/h2bench here, and nothing
    # reported it: the pin had not moved, so the gate kept testing the old code
    # and stayed green for weeks. This job is that missing signal — same build
    # and same tests as the gate, but against Hermod and Styx as they are NOW.
    #
    # Green: the pin can be advanced whenever convenient. Red: upstream broke us,
    # and we find out the next morning rather than at the next bump.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The whole point of this job, in one command. No `branch` is configured in
      # .gitmodules, so --remote follows each submodule's default branch.
      #
      # The commit ids are printed and summarised because they are what makes a
      # red run actionable: the gate's pin plus these two ids bound exactly which
      # upstream commits could be responsible.
      - name: Advance the submodules to their masters
        shell: bash
        run: |
          # The container runs as root while the workspace belongs to a different
          # uid, so git refuses it as "dubious ownership". actions/checkout
          # arranges this for its own operations, but that does not carry over to
          # a plain git command in a later step — which is exactly how this job
          # failed on its first run, on the Linux leg only. The wildcard is
          # acceptable in a single-purpose ephemeral container and survives
          # --recursive reaching paths not known up front.
          git config --global --add safe.directory '*'
          git submodule update --remote --recursive
          hermod=$(git -C libs/Hermod rev-parse HEAD)
          styx=$(git -C libs/Styx   rev-parse HEAD)
          echo "Hermod -> $hermod"
          echo "Styx   -> $styx"
          {
            echo '## Against Hermod master — ${{ matrix.leg }}'
            echo
            echo "Hermod \`${hermod:0:12}\` · Styx \`${styx:0:12}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HTTP2.slnx

      - name: Test (213 HTTP/2 tests, against upstream master)
        timeout-minutes: 30
        run: dotnet test libs/Hermod/HermodTests/HermodTests.csproj --no-build --filter "FullyQualifiedName~Hermod.Tests.HTTP2" --logger "console;verbosity=normal"

      # Both legs now. This used to be Windows-only because the Linux harness
      # suite had three differences of its own that would have drowned the
      # signal about upstream; all three are settled and both legs are 48/48,
      # so restricting it would now hide exactly the case it was protecting.
      - name: Harness suite (48 runs)
        timeout-minutes: 30
        shell: bash
        run: tests/run-tests.sh --no-build

  interop:
    # Our client against eight foreign HTTP/2 servers over the public internet —
    # see INTEROP.md for what the matrix covers and why it exists.
    #
    # This is the one job here that is genuinely informational, and for the
    # reason the sibling repository's whole nightly is: the targets are other
    # people's servers. Bot protection forms opinions about datacentre IPs, hosts
    # go down, CDNs reroute. The harness itself only exits non-zero when EVERY
    # target failed - which means the runner has no network, not that the stack
    # broke - so the job effectively gates on that and reports the rest.
    #
    # One platform is enough: the client is the same code on both, and what is
    # under test here is the foreign end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HTTP2.slnx

      - name: Client interop matrix
        timeout-minutes: 20
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          dotnet run --project tests/h2interop --no-build 2>&1 | tee artifacts/interop.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '## Client interop matrix'
            echo
            echo '```'
            cat artifacts/interop.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Worth keeping across nights rather than reading once: the matrix is how
      # a change in the deployed world becomes visible - a peer that starts
      # advertising ORIGIN, or drops its MAX_CONCURRENT_STREAMS below ours. That
      # is a comparison between nights, and a comparison needs the older file.
      - name: Upload interop matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interop-matrix
          path: artifacts/interop.txt
